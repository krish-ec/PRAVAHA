<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("kc-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login — Kabadiwala Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/page-theme.css" />
  <style>
    :root {
      --env-collector-1: #f6f0e6;
      --env-collector-2: #e7f1ee;
      --env-collector-3: #dfe9df;
      --env-collector-accent: rgba(184, 90, 40, 0.25);
      --env-collector-strong: #b85a28;
      --env-collector-ink: #1d2b28;
      --env-collector-border: rgba(29, 43, 40, 0.12);
      --env-recycler-1: #edf8ee;
      --env-recycler-2: #dfeee8;
      --env-recycler-3: #cfe5d8;
      --env-recycler-accent: rgba(33, 110, 82, 0.18);
      --env-recycler-strong: #1c6d52;
      --env-recycler-ink: #15362d;
      --env-recycler-border: rgba(22, 55, 41, 0.12);
      --env-particle: rgba(255,255,255,0.7);
      --env-surface-glow: rgba(255,255,255,0.45);
    }

    html[data-theme="dark"] {
      --env-collector-1: #171d1b;
      --env-collector-2: #1b2824;
      --env-collector-3: #0f1615;
      --env-collector-accent: rgba(224, 130, 74, 0.2);
      --env-collector-strong: #e0824a;
      --env-collector-ink: #edf2ee;
      --env-collector-border: rgba(236, 242, 238, 0.12);
      --env-recycler-1: #0d1a17;
      --env-recycler-2: #112a22;
      --env-recycler-3: #0d1714;
      --env-recycler-accent: rgba(70, 183, 126, 0.2);
      --env-recycler-strong: #66d5a0;
      --env-recycler-ink: #edf2ee;
      --env-recycler-border: rgba(236, 242, 238, 0.1);
      --env-particle: rgba(255,255,255,0.25);
      --env-surface-glow: rgba(15, 22, 21, 0.4);
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .environment-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 56%);
    }

    .environment-bg::before,
    .environment-bg::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(46px);
      opacity: 0.75;
      animation: ambientGlow 16s ease-in-out alternate infinite;
      pointer-events: none;
    }

    .environment-bg::before {
      width: 58vw;
      height: 58vw;
      left: -12vw;
      top: -12vh;
      background: rgba(184, 90, 40, 0.22);
    }

    .environment-bg::after {
      width: 56vw;
      height: 56vw;
      right: -16vw;
      bottom: -12vh;
      background: rgba(47, 125, 98, 0.2);
      animation-delay: 2s;
    }

    .environment-bg > div {
      position: absolute;
      inset: -10% -12% -8% -12%;
      opacity: 0;
      transform: scale(1.12);
      transition: opacity 1200ms cubic-bezier(.22,.68,0,1), transform 1500ms cubic-bezier(.22,.68,0,1), filter 1200ms cubic-bezier(.22,.68,0,1);
      filter: blur(2px) saturate(0.86);
    }

    .collector-environment,
    .recycler-environment {
      overflow: hidden;
    }

    .collector-environment {
      background:
        radial-gradient(circle at 18% 20%, rgba(184, 90, 40, 0.34), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(90, 128, 119, 0.18), transparent 22%),
        radial-gradient(circle at 52% 62%, rgba(255,255,255,0.24), transparent 28%),
        linear-gradient(135deg, var(--env-collector-1) 0%, var(--env-collector-2) 38%, var(--env-collector-3) 100%);
    }

    .recycler-environment {
      background:
        radial-gradient(circle at 52% 18%, rgba(86, 170, 121, 0.3), transparent 20%),
        radial-gradient(circle at 20% 74%, rgba(31, 111, 80, 0.22), transparent 26%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.18), transparent 20%),
        linear-gradient(135deg, var(--env-recycler-1) 0%, var(--env-recycler-2) 42%, var(--env-recycler-3) 100%);
    }

    .collector-environment::before,
    .recycler-environment::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 82px 82px;
      mask-image: radial-gradient(circle at center, black 48%, transparent 92%);
      opacity: 0.46;
    }

    .collector-environment::after,
    .recycler-environment::after {
      content: "";
      position: absolute;
      inset: 8% 10% auto 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.72), transparent);
      box-shadow: 0 0 18px rgba(255,255,255,0.52);
      opacity: 0.9;
      animation: scanLine 11s linear infinite;
    }

    .collector-scene::before,
    .recycler-scene::before {
      content: "";
      position: absolute;
      inset: 8% 9% 8% 9%;
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 32px 80px rgba(20, 26, 24, 0.05);
      opacity: 0.9;
    }

    .collector-scene,
    .recycler-scene {
      position: absolute;
      inset: 0;
    }

    .collector-box,
    .collector-device,
    .collector-particle,
    .leaf,
    .recycler-ring,
    .vine,
    .recycler-particle {
      position: absolute;
      display: block;
      pointer-events: none;
    }

    .collector-box {
      width: 150px;
      height: 110px;
      border: 1px solid var(--env-collector-border);
      background: rgba(255,255,255,0.12);
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 18px 30px rgba(26,32,30,0.08);
      backdrop-filter: blur(2px);
    }

    .collector-box::before,
    .collector-box::after {
      content: "";
      position: absolute;
      inset: 18% 12%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(135deg, rgba(184, 90, 40, 0.15), rgba(255,255,255,0.05));
    }

    .collector-box::after {
      inset: auto 24% 18% 24%;
      height: 12px;
      border-radius: 999px;
      background: rgba(184, 90, 40, 0.18);
    }

    .collector-box.box-one { left: 10%; bottom: 12%; transform: rotate(-8deg); }
    .collector-box.box-two { right: 10%; bottom: 16%; transform: rotate(12deg); }
    .collector-box.box-three { left: 24%; top: 18%; transform: rotate(10deg); }

    .collector-device {
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.15);
      background: linear-gradient(135deg, rgba(31,34,31,0.22), rgba(255,255,255,0.08));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 18px 30px rgba(20, 24, 23, 0.08);
      width: 160px;
      height: 96px;
    }

    .collector-device::before {
      content: "";
      position: absolute;
      inset: 16% 18%;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(184,90,40,0.18), rgba(90,113,129,0.1));
      border: 1px solid rgba(255,255,255,0.18);
    }

    .collector-device.one { left: 50%; top: 26%; transform: rotate(-10deg); }
    .collector-device.two { right: 18%; top: 28%; transform: rotate(8deg); }

    .collector-particle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--env-particle);
      box-shadow: 0 0 22px rgba(255,255,255,0.45);
      animation: drift 12s ease-in-out infinite alternate;
    }

    .collector-particle.p1 { left: 18%; top: 30%; animation-delay: 0s; }
    .collector-particle.p2 { left: 68%; top: 24%; animation-delay: 2s; }
    .collector-particle.p3 { right: 16%; bottom: 26%; animation-delay: 4s; }
    .collector-particle.p4 { left: 42%; bottom: 12%; animation-delay: 1s; }
    .collector-particle.p5 { left: 78%; top: 68%; animation-delay: 3s; }

    .recycler-scene {
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12), transparent 42%);
    }

    .recycler-ring {
      width: min(62vw, 560px);
      height: min(62vw, 560px);
      border-radius: 50%;
      border: 1px solid rgba(35, 88, 69, 0.22);
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,0.24), transparent 62%);
      animation: pulseRing 10s ease-in-out infinite alternate;
    }

    .recycler-ring.ring-two {
      width: min(78vw, 660px);
      height: min(78vw, 660px);
      border-color: rgba(60, 126, 92, 0.18);
      animation-delay: 1.5s;
    }

    .vine {
      width: 180px;
      height: 180px;
      border: 1px solid rgba(31, 115, 80, 0.18);
      border-radius: 70% 30% 60% 40% / 45% 55% 45% 55%;
      transform-origin: center;
      animation: sway 18s ease-in-out infinite alternate;
    }

    .vine.vine-one { left: -2%; bottom: -6%; }
    .vine.vine-two { right: -4%; top: -8%; transform: rotate(18deg); animation-delay: 2s; }
    .vine.vine-three { left: 12%; top: -10%; transform: rotate(-14deg); }

    .leaf {
      width: 68px;
      height: 88px;
      background: linear-gradient(135deg, rgba(81, 150, 99, 0.82), rgba(177, 214, 175, 0.72));
      border-radius: 60% 0 60% 0;
      box-shadow: inset -8px -12px 20px rgba(27, 76, 50, 0.12), 0 18px 30px rgba(25, 65, 43, 0.08);
      transform-origin: center bottom;
      animation: leafSway 11s ease-in-out infinite alternate;
    }

    .leaf::after {
      content: "";
      position: absolute;
      top: 15%;
      left: 50%;
      width: 1px;
      height: 55%;
      background: rgba(21, 59, 33, 0.35);
      transform: translateX(-50%);
    }

    .leaf.l1 { left: 14%; top: 12%; transform: rotate(-22deg); }
    .leaf.l2 { right: 18%; top: 18%; transform: rotate(18deg); animation-delay: 1.3s; }
    .leaf.l3 { left: 20%; bottom: 16%; transform: rotate(12deg); animation-delay: 2.5s; }
    .leaf.l4 { right: 16%; bottom: 18%; transform: rotate(-14deg); animation-delay: 1.8s; }

    .recycler-particle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(34, 126, 87, 0.52);
      box-shadow: 0 0 14px rgba(130, 214, 156, 0.6);
      animation: drift 15s ease-in-out infinite alternate;
    }

    .recycler-particle.p1 { left: 26%; top: 30%; }
    .recycler-particle.p2 { right: 26%; top: 22%; animation-delay: 1.8s; }
    .recycler-particle.p3 { left: 64%; bottom: 18%; animation-delay: 2.6s; }
    .recycler-particle.p4 { right: 18%; bottom: 24%; animation-delay: 3.5s; }
    .recycler-particle.p5 { left: 42%; top: 72%; animation-delay: 1.2s; }

    body[data-portal="collector"] .collector-environment,
    body[data-portal="recycler"] .recycler-environment {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px) saturate(1.08);
    }

    body[data-portal="collector"] .recycler-environment,
    body[data-portal="recycler"] .collector-environment {
      opacity: 0;
      transform: scale(1.12);
      filter: blur(6px) saturate(0.8);
    }

    body[data-portal="collector"] .collector-scene,
    body[data-portal="recycler"] .recycler-scene {
      opacity: .3;
      transform: scale(1);
      filter: blur(0px);
    }

    body[data-portal="collector"] .recycler-scene,
    body[data-portal="recycler"] .collector-scene {
      opacity: 0;
      transform: scale(1.05);
      filter: blur(4px);
    }

    body[data-portal="collector"] .portal-btn[data-portal="collector"],
    body[data-portal="recycler"] .portal-btn[data-portal="recycler"] {
      border-color: rgba(14,124,102,0.8);
      background: rgba(14,124,102,0.08);
      box-shadow: 0 12px 24px rgba(14,124,102,0.12);
      transform: translateY(-1px);
    }

    body[data-portal="collector"] .portal-btn[data-portal="collector"] .mini-icon,
    body[data-portal="recycler"] .portal-btn[data-portal="recycler"] .mini-icon {
      background: rgba(14,124,102,0.12);
    }

    body[data-portal="collector"] .auth-card,
    body[data-portal="collector"] .portal-chooser {
      box-shadow: 0 24px 60px rgba(21, 38, 36, 0.12), 0 0 0 1px rgba(184, 90, 40, 0.08);
    }

    body[data-portal="recycler"] .auth-card,
    body[data-portal="recycler"] .portal-chooser {
      box-shadow: 0 24px 60px rgba(12, 38, 31, 0.14), 0 0 0 1px rgba(35, 120, 86, 0.1);
    }

    body[data-portal="collector"] .panel-kicker,
    body[data-portal="collector"] .mini-meta,
    body[data-portal="collector"] .auth-button,
    body[data-portal="collector"] .tiny-btn {
      transition: background-color 400ms ease, color 400ms ease, box-shadow 400ms ease;
    }

    body[data-portal="collector"] .panel-kicker {
      color: var(--color-go);
    }

    body[data-portal="collector"] .mini-meta {
      background: rgba(184, 90, 40, 0.08);
      color: var(--color-go-dark);
    }

    body[data-portal="collector"] .auth-button,
    body[data-portal="collector"] .tiny-btn {
      background: var(--color-go);
      box-shadow: 0 10px 22px rgba(184, 90, 40, 0.18);
    }

    body[data-portal="recycler"] .panel-kicker {
      color: var(--env-recycler-strong);
    }

    body[data-portal="recycler"] .mini-meta {
      background: rgba(36, 117, 81, 0.08);
      color: #1d694d;
    }

    body[data-portal="recycler"] .auth-button {
      background: linear-gradient(135deg, #1d6d52 0%, #2f9a72 100%);
      box-shadow: 0 10px 22px rgba(28, 109, 82, 0.24);
    }

    body[data-portal="recycler"] .tiny-btn.secondary {
      background: rgba(28, 109, 82, 0.08);
      color: #1d694d;
    }

    body[data-portal="recycler"] .method-btn.active,
    body[data-portal="recycler"] .mode-tab.active {
      background: rgba(28, 109, 82, 0.08);
      color: var(--color-text);
    }

    body[data-portal="collector"] .method-btn.active,
    body[data-portal="collector"] .mode-tab.active {
      background: rgba(184, 90, 40, 0.08);
      color: var(--color-text);
    }

    body[data-portal="recycler"] .portal-btn span,
    body[data-portal="collector"] .portal-btn span {
      transition: color 300ms ease;
    }

    .world-state {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.66rem 0.95rem;
      margin: 1rem 0 0.8rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 10px 30px rgba(18, 27, 25, 0.08);
      backdrop-filter: blur(8px);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--color-text-muted);
    }

    .world-state .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-go);
      box-shadow: 0 0 0 4px rgba(184, 90, 40, 0.12);
    }

    body[data-portal="recycler"] .world-state .state-dot {
      background: #2a8a5e;
      box-shadow: 0 0 0 4px rgba(40, 126, 88, 0.1);
    }

    .login-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.5rem clamp(1.25rem, 4vw, 2.5rem) 4rem;
      position: relative;
      z-index: 1;
    }
    .login-shell {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1.5rem;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .login-shell { grid-template-columns: 1fr; }
    }
    .portal-chooser, .auth-card {
      background: color-mix(in srgb, var(--color-surface-elevated) 88%, transparent);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .portal-chooser {
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
    }
    .portal-chooser::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 45%);
      pointer-events: none;
    }
    .panel-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--color-go);
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }
    .panel-kicker::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      box-shadow: 0 0 0 4px rgba(184, 90, 40, 0.1);
    }
    .portal-picker {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
      margin-top: 1.25rem;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 540px) { .portal-picker { grid-template-columns: 1fr; } }
    .portal-btn {
      padding: 1.1rem 1rem;
      border-radius: 18px;
      border: 1.5px solid var(--color-border);
      background: rgba(255,255,255,0.58);
      text-align: left;
      transition: all 0.22s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .portal-btn:hover, .portal-btn.active {
      border-color: var(--color-go);
      background: rgba(255,255,255,0.82);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(18, 27, 25, 0.09);
    }
    .portal-btn .mini-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(14, 124, 102, 0.08);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .portal-btn strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 0.2rem;
      color: var(--color-text);
    }
    .portal-btn span {
      display: block;
      color: var(--color-text-muted);
      font-size: 0.82rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .portal-btn strong, .mode-tab, .method-btn, .auth-button, .demo-button, .helper { overflow-wrap: anywhere; }
    .auth-card {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .auth-card::before,
    .portal-chooser::after {
      content: "";
      position: absolute;
      inset: auto -25% -45% auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 90, 40, 0.12), transparent 68%);
      pointer-events: none;
      filter: blur(12px);
    }

    .portal-chooser::after {
      inset: auto auto -20% -10%;
      background: radial-gradient(circle, rgba(42, 138, 94, 0.12), transparent 68%);
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      padding: 0.35rem;
      margin-bottom: 1rem;
    }
    .mode-tab {
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0.7rem 0.4rem;
      font-weight: 700;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--color-surface-elevated);
      color: var(--color-text);
      box-shadow: var(--shadow-sm);
    }
    .auth-form {
      display: grid;
      gap: 1rem;
    }
    .field { display: grid; gap: 0.45rem; }
    label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-text);
    }
    input {
      min-height: 48px;
      border-radius: 14px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      padding: 0.85rem 1rem;
      font: inherit;
      color: var(--color-text);
    }
    input:focus {
      outline: none;
      border-color: var(--color-go);
      box-shadow: 0 0 0 3px rgba(14,124,102,0.12);
    }
    .method-toggle {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      padding: 0.35rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
    }
    .method-btn {
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--color-text-muted);
      padding: 0.75rem 0.5rem;
      font-weight: 700;
      cursor: pointer;
    }
    .method-btn.active {
      background: var(--color-surface-elevated);
      color: var(--color-text);
      box-shadow: var(--shadow-sm);
    }
    .otp-box {
      padding: 0.75rem 0.85rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      display: grid;
      gap: 0.7rem;
    }
    .otp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .tiny-btn {
      border: 0;
      border-radius: 999px;
      background: var(--color-go);
      color: white;
      font-weight: 700;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .tiny-btn.secondary {
      background: rgba(14,124,102,0.08);
      color: var(--color-go-dark);
    }
    .auth-button {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--color-go);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(14,124,102,0.22);
    }
    .demo-button {
      min-height: 46px;
      border: 1.5px solid var(--color-go);
      border-radius: 14px;
      background: transparent;
      color: var(--color-go-dark);

    }
    .demo-button:hover {

    }
    .helper {
      font-size: 0.78rem;
      color: var(--color-text-muted);

      margin-top: 0.5rem;
    }
    .alert {
      border-radius: 14px;
      padding: 0.8rem 0.9rem;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .alert.error { background: var(--color-hazard-bg); color: var(--color-hazard); }
    .alert.info { background: var(--color-info-bg); color: var(--color-go-dark); }
    .screen-title {
      margin: 0 0 0.35rem;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-family: var(--font-display);
      color: var(--color-text);
      line-height: 1.15;
      position: relative;
      z-index: 1;
    }
    .screen-sub {
      margin: 0 0 1rem;
      color: var(--color-text-muted);
      position: relative;
      z-index: 1;
    }
    .mini-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(14,124,102,0.08);

    /* ---------- Footer (identical to the homepage) ---------- */
    .site-footer{background:var(--panel); color:var(--ink); padding:5.5rem 0 2rem; border-top:1px solid var(--border); margin-top:2rem; position:relative; z-index:1;}
    .site-footer .container{max-width:1180px; margin:0 auto; padding:0 clamp(1.25rem,4vw,2.5rem);}
    .footer-statement{font-family:var(--font-display); font-weight:600; font-size:clamp(1.7rem,3.6vw,2.6rem); line-height:1.15; margin-bottom:3.5rem; max-width:36rem; color:var(--ink);}
    .footer-statement .accent{color:var(--copper);}
    .footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:2.5rem; padding-bottom:3rem; border-bottom:1px solid var(--border);}
    @media (max-width:760px){ .footer-grid{grid-template-columns:1fr 1fr;} }
    .footer-brand .logo{margin-bottom:.9rem; display:flex; align-items:center;}
    .footer-brand p{color:var(--ink-dim); font-size:.88rem; max-width:20rem;}
    .footer-col h4{font-size:.78rem; font-weight:700; letter-spacing:.03em; color:var(--ink-faint); margin:0 0 .9rem;}
    .footer-col a{display:block; font-size:.9rem; color:var(--ink-dim); margin-bottom:.65rem; text-decoration:none;}
    .footer-col a:hover{color:var(--copper);}
    .footer-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem; padding-top:1.4rem; font-size:.8rem; color:var(--ink-faint);}

    @keyframes drift {
      0% { transform: translate3d(0,0,0) scale(0.9); opacity: 0.45; }
      100% { transform: translate3d(12px,-18px,0) scale(1.15); opacity: 1; }
    }

    @keyframes scanLine {
      0% { transform: translateX(-8%) scaleX(0.92); opacity: 0.6; }
      50% { transform: translateX(5%) scaleX(1); opacity: 0.9; }
      100% { transform: translateX(8%) scaleX(0.92); opacity: 0.6; }
    }

    @keyframes pulseRing {
      0% { transform: translate(-50%, -50%) scale(0.96); opacity: 0.66; }
      100% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
    }

    @keyframes sway {
      0% { transform: rotate(-12deg) translateX(0) scale(0.98); }
      100% { transform: rotate(12deg) translateX(8px) scale(1.04); }
    }

    @keyframes leafSway {
      0% { transform: rotate(-12deg) translateY(0); }
      100% { transform: rotate(16deg) translateY(10px); }
    }

    @keyframes ambientGlow {
      0% { transform: scale(0.96) translate3d(0,0,0); opacity: 0.5; }
      100% { transform: scale(1.08) translate3d(2vw,-1vh,0); opacity: 0.8; }
    }

    @media (max-width: 640px) {
      .environment-bg { opacity: 0.85; }
      .collector-box { width: 82px; height: 60px; }
      .collector-device { width: 96px; height: 64px; }
      .vine { width: 124px; height: 124px; }
      .leaf { width: 40px; height: 54px; }
      .world-state { letter-spacing: 0.08em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .environment-bg > div,
      .collector-environment::after,
      .recycler-environment::after,
      .collector-particle,
      .recycler-particle,
      .recycler-ring,
      .vine,
      .leaf {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Cinematic environment system: the original auth layout remains above these layers. */
    :root {
      --env-active: #c66a35;
      --env-active-rgb: 198, 106, 53;
      --env-deep: #171816;
      --env-light: #f0d3aa;
    }
    html[data-theme="dark"] {
      --env-deep: #080d0b;
      --env-light: #ffe1b8;
    }
    body[data-portal="recycler"] {
      --env-active: #4bcc88;
      --env-active-rgb: 75, 204, 136;
      --env-deep: #092219;
      --env-light: #caffd9;
    }
    .environment-bg {
      z-index: 0;
      background: var(--env-deep);
      perspective: 1000px;
      transition: background 900ms ease;
    }
    .environment-bg::before,
    .environment-bg::after { content: none; }
    .environment-bg > div {
      inset: 0;
      opacity: 0;
      transform: scale(1.06);
      filter: none;
      transition: opacity 800ms ease, transform 1100ms cubic-bezier(.2,.7,.15,1);
      will-change: opacity, transform;
    }
    body[data-portal="collector"] .collector-environment,
    body[data-portal="recycler"] .recycler-environment {
      opacity: 1;
      transform: scale(1);
      filter: none;
    }
    body[data-portal="collector"] .recycler-environment,
    body[data-portal="recycler"] .collector-environment {
      opacity: 0;
      transform: scale(1.08);
      filter: none;
    }
    .collector-environment,
    .recycler-environment {
      overflow: hidden;
      isolation: isolate;
      background-color: #edf1e9;
      background-image:
        radial-gradient(ellipse at 76% 44%, rgba(203,128,83,.14), transparent 34%),
        radial-gradient(ellipse at 22% 68%, rgba(84,139,125,.12), transparent 36%),
        radial-gradient(ellipse at 52% 50%, rgba(255,255,255,.48), transparent 48%),
        linear-gradient(125deg, #f4f0e7 0%, #e8efea 48%, #e4ece5 100%);
    }
    html[data-theme="dark"] .collector-environment {
      background-image:
        radial-gradient(ellipse at 76% 44%, rgba(224,133,82,.2), transparent 34%),
        radial-gradient(ellipse at 22% 68%, rgba(55,143,131,.16), transparent 36%),
        radial-gradient(ellipse at 52% 50%, rgba(130,95,68,.14), transparent 48%),
        linear-gradient(125deg, #202623 0%, #2a2924 48%, #1d2925 100%);
    }
    .recycler-environment {
      background-image:
        radial-gradient(ellipse at 50% 49%, rgba(97,166,116,.15), transparent 28%),
        radial-gradient(ellipse at 12% 32%, rgba(133,174,126,.16), transparent 36%),
        radial-gradient(ellipse at 88% 70%, rgba(77,151,115,.14), transparent 40%),
        linear-gradient(135deg, #edf2e9 0%, #e2eee5 48%, #e6eee4 100%);
    }
    html[data-theme="dark"] .recycler-environment {
      background-image:
        radial-gradient(ellipse at 50% 49%, rgba(67,165,111,.2), transparent 28%),
        radial-gradient(ellipse at 12% 32%, rgba(36,120,72,.2), transparent 36%),
        radial-gradient(ellipse at 88% 70%, rgba(23,119,78,.2), transparent 40%),
        linear-gradient(135deg, #1c2923 0%, #20382b 48%, #1b2b24 100%);
    }
    .collector-environment::before,
    .recycler-environment::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: .2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(24,43,34,.12) 100%);
    }
    .collector-environment::after,
    .recycler-environment::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: -40% auto -40% 10%;
      width: 28%;
      height: auto;
      opacity: .08;
      background: linear-gradient(90deg, transparent, rgba(255,224,182,.34), transparent);
      filter: blur(15px);
      transform: rotate(18deg);
      animation: envRay 30s ease-in-out infinite alternate;
    }
    .recycler-environment::after {
      left: 62%;
      width: 24%;
      opacity: .08;
      background: linear-gradient(90deg, transparent, rgba(218,255,190,.32), transparent);
      animation-duration: 36s;
    }
    .collector-scene::before,
    .recycler-scene::before { display: none; }
    .collector-scene,
    .recycler-scene {
      z-index: 3;
      opacity: .3;
      transform: none;
      transition: transform 900ms cubic-bezier(.2,.7,.15,1), opacity 600ms ease;
    }
    .collector-environment .collector-scene { transform: translate3d(var(--mx,0px),var(--my,0px),0); }
    .recycler-environment .recycler-scene { transform: translate3d(calc(var(--mx,0px) * -1),var(--my,0px),0); }
    .collector-scene,
    .recycler-scene { opacity: .48; }

    .env-atmosphere, .env-grid, .env-particles, .env-core, .env-wave, .env-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .env-atmosphere { z-index: 0; overflow: hidden; }
    .env-atmosphere::before,
    .env-atmosphere::after {
      content: "";
      position: absolute;
      width: 60vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(30px);
      opacity: .3;
      background: radial-gradient(circle, rgba(var(--env-active-rgb),.4), transparent 67%);
      animation: atmosphereDrift 42s ease-in-out infinite alternate;
    }
    .env-atmosphere::before { left: -20vw; top: 10vh; }
    .env-atmosphere::after { right: -22vw; bottom: -15vh; animation-delay: -8s; }
    .env-grid {
      z-index: 2;
      opacity: .08;
      background-image: linear-gradient(rgba(230,225,205,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(230,225,205,.2) 1px,transparent 1px);
      background-size: 76px 76px;
      mask-image: radial-gradient(ellipse at 50% 48%, #000 0%, transparent 74%);
      transform: translate3d(calc(var(--mx,0px) * .4),calc(var(--my,0px) * .4),0);
    }
    .recycler-environment .env-grid {
      opacity: .06;
      background-image: radial-gradient(rgba(211,255,203,.6) 1px,transparent 1px);
      background-size: 34px 34px;
    }
    .env-particles { z-index: 5; }
    .env-particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--particle-color, #ffd2a6);
      opacity: var(--alpha,.7);
      box-shadow: 0 0 10px currentColor, 0 0 24px rgba(var(--env-active-rgb),.5);
      animation: particleFloat var(--duration,24s) ease-in-out var(--delay,0s) infinite alternate;
      transition: left 700ms ease, top 700ms ease, opacity 500ms ease, background-color 600ms ease;
      transform: translateZ(0);
    }
    .recycler-environment .env-particle { --particle-color: #a5ffc0; }
    .env-core {
      z-index: 4;
      inset: 50% auto auto 50%;
      width: min(45vw,560px);
      aspect-ratio: 1;
      transform: translate(-50%,-50%) translate3d(calc(var(--mx,0px) * .7),calc(var(--my,0px) * .7),0);
      display: grid;
      place-items: center;
    }
    .core-aura,.core-ring,.core-center { position: absolute; border-radius: 50%; }
    .core-aura {
      inset: 19%;
      background: radial-gradient(circle, rgba(var(--env-active-rgb),.3),rgba(var(--env-active-rgb),.1) 40%,transparent 70%);
      filter: blur(8px);
      animation: corePulse 12s ease-in-out infinite alternate;
    }
    .core-ring { border: 1px solid rgba(255,221,179,.52); box-shadow: 0 0 22px rgba(var(--env-active-rgb),.28), inset 0 0 22px rgba(var(--env-active-rgb),.15); }
    .core-ring.ring-a { inset: 9%; border-width: 1px; border-right-color: transparent; border-bottom-color: rgba(255,221,179,.12); animation: orbit 72s linear infinite; }
    .core-ring.ring-b { inset: 17%; border-width: 2px; border-top-color: transparent; border-left-color: rgba(255,221,179,.14); animation: orbitReverse 58s linear infinite; }
    .core-ring.ring-c { inset: 27%; border-style: dashed; border-color: rgba(255,221,179,.38); animation: orbit 90s linear infinite; }
    .core-ring.ring-d { inset: 35%; border-color: rgba(255,238,209,.38); box-shadow: 0 0 38px rgba(var(--env-active-rgb),.32); animation: corePulse 11s ease-in-out infinite alternate; }
    .core-center {
      inset: 42%;
      background: radial-gradient(circle at 38% 34%, #fff2d9 0%, var(--env-light) 9%, var(--env-active) 35%, rgba(var(--env-active-rgb),.04) 76%);
      box-shadow: 0 0 35px rgba(var(--env-active-rgb),.9), 0 0 90px rgba(var(--env-active-rgb),.52);
      animation: corePulse 10s ease-in-out infinite alternate;
    }
    .collector-environment .core-center::after {
      content: "";
      position: absolute;
      inset: -42%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 69%, rgba(255,224,185,.95) 77%, transparent 83% 100%);
      mask: radial-gradient(circle, transparent 60%, #000 62% 66%, transparent 68%);
      animation: orbit 24s linear infinite;
    }
    .recycler-environment .core-ring { border-color: rgba(193,255,196,.6); box-shadow: 0 0 26px rgba(77,231,133,.35), inset 0 0 23px rgba(77,231,133,.16); }
    .recycler-environment .core-ring.ring-a { border-right-color: transparent; border-bottom-color: rgba(193,255,196,.1); }
    .recycler-environment .core-ring.ring-b { border-top-color: transparent; border-left-color: rgba(193,255,196,.14); }
    .recycler-environment .core-ring.ring-c { border-color: rgba(185,255,184,.4); }
    .recycler-environment .core-ring.ring-d { border-color: rgba(206,255,189,.56); }
    .recycler-environment .core-center {
      background: radial-gradient(circle at 38% 34%, #f1ffd9 0%, #b8ff96 10%, #47dc83 37%, rgba(36,178,99,.04) 78%);
      box-shadow: 0 0 42px rgba(87,255,138,.9), 0 0 110px rgba(67,220,127,.56);
    }
    .recycler-environment .core-center::after {
      content: ""; position: absolute; inset: -48%; border-radius: 50%;
      background: conic-gradient(from 25deg, transparent 0 66%, rgba(218,255,190,.95) 74%, transparent 82% 100%);
      mask: radial-gradient(circle, transparent 57%, #000 60% 64%, transparent 67%);
      animation: orbitReverse 28s linear infinite;
    }
    .env-hud { z-index: 6; opacity: .12; }
    .env-hud::before,.env-hud::after {
      content: ""; position: absolute; width: 17vw; height: 17vw; min-width: 120px; min-height: 120px;
      border: 1px solid rgba(255,223,182,.22); border-radius: 50%;
      mask: conic-gradient(#000 0 2deg,transparent 2deg 10deg,#000 10deg 11deg,transparent 11deg 30deg,#000 30deg 31deg,transparent 31deg 100%);
    }
    .env-hud::before { left: 8%; top: 12%; }
    .env-hud::after { right: 8%; bottom: 8%; transform: rotate(84deg); }
    .recycler-environment .env-hud { opacity: .1; }
    .recycler-environment .env-hud::before,.recycler-environment .env-hud::after { border-color: rgba(205,255,188,.28); }
    .env-wave {
      z-index: 8;
      inset: 50% auto auto 50%;
      width: 4vmin; height: 4vmin;
      border: 2px solid rgba(255,239,210,.9);
      border-radius: 50%; opacity: 0;
      transform: translate(-50%,-50%) scale(.1);
      background: radial-gradient(circle,rgba(255,245,220,.6),rgba(var(--env-active-rgb),.15) 42%,transparent 72%);
      box-shadow: 0 0 45px rgba(var(--env-active-rgb),.8), inset 0 0 45px rgba(255,255,255,.45);
    }
    .transition-flash {
      position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,244,220,.72),rgba(var(--env-active-rgb),.28) 18%,transparent 58%);
    }
    body.is-transitioning .environment-bg > div { animation: worldImpact 1250ms cubic-bezier(.2,.7,.15,1) both; }
    body.is-transitioning .env-wave { animation: waveBurst 1250ms cubic-bezier(.1,.65,.2,1) both; }
    body.is-transitioning .transition-flash { animation: flashPulse 1250ms ease-out both; }
    body.is-transitioning .env-wave { opacity: .35; }
    body.is-transitioning .transition-flash { opacity: .18; }
    body[data-phase="collapse"] .env-particle,
    body[data-phase="impact"] .env-particle { left: 50% !important; top: 50% !important; opacity: 1; }
    body[data-phase="collapse"] .core-ring,
    body[data-phase="impact"] .core-ring { animation-duration: 1.2s !important; }
    body[data-phase="expand"] .env-particle,
    body[data-phase="settle"] .env-particle { opacity: var(--alpha,.7); }
    body.is-transitioning .core-aura { animation-duration: .6s; }

    .collector-device, .collector-box, .leaf, .vine, .recycler-ring { z-index: 4; }
    .collector-device {
      width: 152px; height: 96px; border: 2px solid rgba(242,202,159,.7);
      border-radius: 20px; background: linear-gradient(145deg,rgba(27,29,28,.94),rgba(93,75,59,.7));
      box-shadow: 0 26px 50px rgba(0,0,0,.34), inset 0 0 0 2px rgba(255,255,255,.08), 0 0 32px rgba(213,111,57,.2);
    }
    .collector-device::before { inset: 11% 12%; border-radius: 11px; background: linear-gradient(135deg,rgba(216,117,59,.58),rgba(25,137,135,.36)); }
    .collector-device::after { content:""; position:absolute; width:4px; height:4px; border-radius:50%; background:#e8c7a2; right:8px; top:50%; }
    .collector-device.one { left: 8%; top: 37%; transform: rotate(-18deg); }
    .collector-device.two { right: 8%; top: 23%; transform: rotate(14deg) scale(.82); }
    .collector-box { width: 146px; height: 110px; background: linear-gradient(140deg,rgba(140,91,55,.55),rgba(41,38,33,.72)); border: 1px solid rgba(240,190,143,.55); box-shadow: 0 22px 45px rgba(0,0,0,.25),0 0 24px rgba(201,101,51,.17); }
    .collector-box.box-one { left: 10%; bottom: 10%; transform: rotate(9deg); }
    .collector-box.box-two { right: 13%; bottom: 8%; transform: rotate(-11deg) scale(.8); }
    .collector-box.box-three { left: 31%; top: 8%; transform: rotate(12deg) scale(.64); }
    .scrap-chip { position:absolute; z-index:4; width:72px; height:72px; border:2px solid rgba(91,198,181,.78); background:linear-gradient(145deg,rgba(26,77,73,.86),rgba(29,35,33,.88)); box-shadow:0 0 28px rgba(49,191,170,.3), 0 18px 35px rgba(0,0,0,.25); transform:rotate(18deg); }
    .scrap-chip::before { content:""; position:absolute; inset:19%; border:1px solid rgba(237,188,124,.7); background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(230,156,87,.6) 8px 10px), repeating-linear-gradient(0deg,transparent 0 8px,rgba(230,156,87,.42) 8px 10px); }
    .scrap-chip::after { content:""; position:absolute; inset:-12px; background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(91,198,181,.8) 10px 12px); mask:linear-gradient(#000,#000) center/100% 2px no-repeat; }
    .scrap-chip.chip-a { left:23%; bottom:24%; }
    .scrap-chip.chip-b { right:27%; top:14%; transform:rotate(-12deg) scale(.58); }
    .battery-shape { position:absolute; z-index:4; width:32px; height:72px; border:2px solid rgba(235,191,144,.8); border-radius:8px; background:linear-gradient(180deg,rgba(219,117,54,.7),rgba(40,46,42,.92)); box-shadow:0 0 22px rgba(218,123,60,.34); transform:rotate(28deg); }
    .battery-shape::before { content:""; position:absolute; width:12px; height:5px; left:8px; top:-7px; border-radius:3px 3px 0 0; background:rgba(235,191,144,.8); }
    .battery-shape::after { content:""; position:absolute; left:6px; right:6px; top:18px; height:28px; border-block:1px solid rgba(255,231,195,.65); }
    .battery-shape.battery-a { right:33%; bottom:16%; }
    .cable-loop { position:absolute; z-index:4; width:145px; height:92px; border:3px solid rgba(193,106,55,.77); border-right-color:rgba(48,170,157,.84); border-radius:50%; filter:drop-shadow(0 0 10px rgba(221,121,60,.4)); transform:rotate(-28deg); }
    .cable-loop::before { content:""; position:absolute; right:-8px; top:36px; width:14px; height:14px; border:2px solid #d5a17b; background:#29302c; }
    .cable-loop.cable-a { left:38%; bottom:8%; }

        <h1 class="screen-title" data-i18n="login_choose">Choose your portal</h1>
        <p class="screen-sub" data-i18n="login_subtitle">Access the collector or recycler workspace with secure demo login.</p>

        <div class="portal-picker">
          <button type="button" class="portal-btn active" data-portal="collector">
            <div class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v10H4z"/><circle cx="12" cy="13" r="3"/><path d="M18.5 3.5v2M17.5 4.5h2M5 20c2-2 4-2 6 0"/></svg></div>
            <strong data-i18n="login_collector">Collector Portal</strong>
            <span data-i18n="login_collector_desc">Scan scrap, price it, find authorized recyclers and track your earnings.</span>
          </button>
          <button type="button" class="portal-btn" data-portal="recycler">
            <div class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9l5 3V9l5 3V7h4v12z"/><path d="M8 16h.01M12 16h.01M16 16h.01M17 4c2 0 3 1.5 3 3M17 4c-2 0-3 1.5-3 3"/></svg></div>

        <div class="mode-tabs" role="tablist" aria-label="Authentication mode">
          <button type="button" class="mode-tab active" data-mode="login" data-i18n="login_login">Login</button>

            <label for="contactInput" data-i18n="login_contact">Email or mobile number *</label>
            <input id="contactInput" type="text" placeholder="rekha@example.com / +91 98200 00000" autocomplete="username" />

            <input id="passInput" type="password" placeholder="Minimum 4 characters" autocomplete="current-password" />

            <div class="otp-row">

              <input id="otpInput" type="text" maxlength="6" inputmode="numeric" placeholder="••••••" />
            </div>
          </div>

          <div id="alertBox" class="alert info" style="display:none"></div>

          <button type="submit" class="auth-button" id="submitBtn" data-i18n="login_submit_collector">Login as Collector</button>

  <script src="../js/i18n.js"></script>
  <script>
    const portalButtons = document.querySelectorAll('.portal-btn');
    const modeButtons = document.querySelectorAll('.mode-tab');
    const methodButtons = document.querySelectorAll('.method-btn');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const nameField = document.querySelector('[data-field="name"]');
    const passField = document.querySelector('[data-password-field]');
    const otpBox = document.querySelector('[data-otp-box]');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const nameInput = document.getElementById('nameInput');
    const contactInput = document.getElementById('contactInput');
    const passInput = document.getElementById('passInput');
    const otpInput = document.getElementById('otpInput');
    const demoBtn = document.getElementById('demoBtn');
    const particleContainers = document.querySelectorAll('.env-particles');

    let activePortal = 'collector';
    let activeMode = 'login';
    let activeMethod = 'password';
    let environmentTimers = [];
    const portalFadeOutMs = 220;
    const portalFadeInMs = 460;
    let particleSeed = 0;
    let parallaxFrame = 0;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const particlePositions = Array.from({ length: 42 }, (_, index) => {
      if (index < 12) return [4 + (index * 8), 2 + ((index % 3) * 3)];
      if (index < 24) {
        const offset = index - 12;
        return [4 + (offset * 8), 98 - ((offset % 3) * 3)];
      }
      if (index < 33) {
        const offset = index - 24;
        return [2 + ((offset % 3) * 2), 16 + (offset * 8.5)];
      }
      const offset = index - 33;
      return [98 - ((offset % 3) * 2), 16 + (offset * 8.5)];
    });
    const particleSizes = [2, 3, 2, 4, 3, 2, 5, 3, 2];
    const particleDurations = [6, 8, 11, 14, 17, 21];

    function clearEnvironmentTimers() {
      environmentTimers.forEach(window.clearTimeout);
      environmentTimers = [];
      document.body.classList.remove('portal-copy-fade-out', 'portal-copy-fade-in');
    }

    function fillParticles(portal, collapsed) {
      particleContainers.forEach((container) => {
        if (container.dataset.particles !== portal) return;
        container.replaceChildren();
        for (let index = 0; index < particlePositions.length; index += 1) {
          const particle = document.createElement('i');
          const [x, y] = particlePositions[(index + particleSeed) % particlePositions.length];
          particle.className = 'env-particle';
          particle.style.setProperty('--x', collapsed && index < 3 ? '50%' : x + '%');
          particle.style.setProperty('--y', collapsed && index < 3 ? '50%' : y + '%');
          particle.style.setProperty('--size', particleSizes[index % particleSizes.length] + 'px');
          particle.style.setProperty('--alpha', (0.22 + (index % 6) * 0.07).toFixed(2));
          particle.style.setProperty('--duration', particleDurations[index % particleDurations.length] + 's');
          particle.style.setProperty('--delay', (-((index * 7) % 15)) + 's');
          container.appendChild(particle);
        }
      });
      particleSeed += 1;
    }

    function setParticleSpread(portal) {
      const container = document.querySelector('.env-particles[data-particles="' + portal + '"]');
      if (!container) return;
      container.querySelectorAll('.env-particle').forEach((particle, index) => {
        const [x, y] = particlePositions[(index + particleSeed) % particlePositions.length];
        particle.style.left = x + '%';
        particle.style.top = y + '%';
      });
    }

    function setAlert(message, type) {
      if (!message) {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
        return;
      }
      alertBox.textContent = message;
      alertBox.className = 'alert ' + type;
      alertBox.style.display = 'block';
    }

    function syncPortalText() {
      const key = activeMode === 'login'
        ? (activePortal === 'collector' ? 'login_submit_collector' : 'login_submit_recycler')
        : (activePortal === 'collector' ? 'login_create_collector' : 'login_create_recycler');
      submitBtn.textContent = window.KC && KC.t ? KC.t(key) : (activePortal === 'collector' ? 'Login as Collector' : 'Login as Recycler');
    }

    function syncFooterStatement(portal) {
      const lead = document.getElementById('footerStatementLead');
      const accent = document.getElementById('footerStatementAccent');
      if (!lead || !accent) return;
      const suffix = portal === 'recycler' ? 'recycler' : 'collector';
      const leadKey = 'login_footer_' + suffix + '_l1';
      const accentKey = 'login_footer_' + suffix + '_l2';
      lead.dataset.i18n = leadKey;
      accent.dataset.i18n = accentKey;
      lead.textContent = window.KC && KC.t ? KC.t(leadKey) : (suffix === 'collector' ? 'Turn your scrap into' : 'Give recovered materials a');
      accent.textContent = window.KC && KC.t ? KC.t(accentKey) : (suffix === 'collector' ? 'traceable value.' : 'traceable second life.');
    }

    function setEnvironment(portal) {
      const targetPortal = portal === 'recycler' ? 'recycler' : 'collector';
      const currentPortal = document.body.dataset.portal || 'collector';
      if (targetPortal === currentPortal || reducedMotion.matches) {
        clearEnvironmentTimers();
        document.body.classList.remove('is-transitioning');
        document.body.removeAttribute('data-phase');
        document.body.dataset.phase = 'settle';
        document.body.dataset.portal = targetPortal;
        portalButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.portal === targetPortal);
        });
        syncFooterStatement(targetPortal);
        syncPortalText();
        fillParticles(targetPortal, false);
        return;
      }

      clearEnvironmentTimers();
      document.body.classList.add('portal-copy-fade-out');
      document.body.classList.add('is-transitioning');
      document.body.dataset.phase = 'fade-out';
      document.body.dataset.from = currentPortal;
      environmentTimers.push(window.setTimeout(() => {
        document.body.dataset.portal = targetPortal;
        document.body.removeAttribute('data-phase');
        portalButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.portal === targetPortal);
        });
        syncFooterStatement(targetPortal);
        syncPortalText();
        fillParticles(targetPortal, false);
        document.body.classList.remove('portal-copy-fade-out');
        document.body.classList.add('portal-copy-fade-in');
      }, portalFadeOutMs));
      environmentTimers.push(window.setTimeout(() => {
        document.body.classList.remove('is-transitioning');
        document.body.classList.remove('portal-copy-fade-in');
        document.body.removeAttribute('data-from');
      }, portalFadeOutMs + portalFadeInMs));
    }

    if (!reducedMotion.matches && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.addEventListener('pointermove', (event) => {
        if (parallaxFrame) return;
        parallaxFrame = window.requestAnimationFrame(() => {
          const x = ((event.clientX / window.innerWidth) - 0.5) * 8;
          const y = ((event.clientY / window.innerHeight) - 0.5) * 6;
          document.documentElement.style.setProperty('--mx', x.toFixed(1) + 'px');
          document.documentElement.style.setProperty('--my', y.toFixed(1) + 'px');
          parallaxFrame = 0;
        });
      }, { passive: true });
    }

    function syncFields() {
      nameField.style.display = 'grid';
      passField.style.display = activeMethod === 'password' ? 'grid' : 'none';
      otpBox.classList.toggle('hidden', activeMethod !== 'otp');
      otpBox.style.display = activeMethod === 'otp' ? 'grid' : 'none';
      syncPortalText();
    }

    portalButtons.forEach((button) => {
      button.addEventListener('click', () => {
        activePortal = button.dataset.portal;
        setEnvironment(activePortal);
        setAlert('', 'info');
      });
    });

    modeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        modeButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
        activeMode = button.dataset.mode;
        setAlert('', 'info');
        syncFields();
      });
    });

    methodButtons.forEach((button) => {
      button.addEventListener('click', () => {
        methodButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
        activeMethod = button.dataset.method;
        setAlert('', 'info');
        syncFields();
      });
    });

    sendOtpBtn.addEventListener('click', () => {
      if (!contactInput.value.trim()) {
        setAlert('Enter a valid email or mobile number first.', 'error');
        return;
      }
      setAlert('OTP sent to ' + contactInput.value.trim() + ' (demo mode).', 'info');
    });

    demoBtn.addEventListener('click', () => {
      const demoAccount = activePortal === 'collector'
        ? { name: 'Demo Collector', contact: 'collector@pravaha.demo' }
        : { name: 'GreenCycle Recycling', contact: 'recycler@pravaha.demo' };

      modeButtons.forEach((button) => button.classList.toggle('active', button.dataset.mode === 'login'));
      methodButtons.forEach((button) => button.classList.toggle('active', button.dataset.method === 'password'));
      activeMode = 'login';
      activeMethod = 'password';
      nameInput.value = demoAccount.name;
      contactInput.value = demoAccount.contact;
      passInput.value = 'pravaha';
      otpInput.value = '';
      syncFields();
      document.getElementById('authForm').requestSubmit();
    });

    document.getElementById('authForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const nameOk = nameInput.value.trim().length >= 2;
      const contactOk = contactInput.value.trim().length >= 4;
      const passOk = activeMethod === 'password' ? passInput.value.trim().length >= 4 : true;
      const otpOk = activeMethod === 'otp' ? otpInput.value.trim().length === 6 : true;

      if (!nameOk) {
        setAlert('Please enter your full name to continue.', 'error');
        return;
      }
      if (!contactOk) {
        setAlert('Enter a valid email address or mobile number.', 'error');
        return;
      }
      if (!passOk || !otpOk) {
        setAlert('Complete the required authentication details before continuing.', 'error');
        return;
      }

      setAlert(activePortal === 'collector' ? 'Collector portal access granted.' : 'Recycler portal access granted.', 'info');
      const target = activePortal === 'collector' ? '../pages/collector-portal.html' : '../pages/recycler.html';
      setTimeout(function () { window.location.href = target; }, 500);
    });

    fillParticles('collector', false);
    fillParticles('recycler', false);
    setEnvironment(activePortal);
    syncFields();
  </script>
